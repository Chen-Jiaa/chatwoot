services:
  - type: web
    name: chatwoot-rails
    env: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./docker/dockerfiles/rails.Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: REDIS_PASSWORD
        generateValue: true

  - type: redis
    name: chatwoot-redis
    plan: starter

databases:
  - name: chatwoot-db
    plan: starter
